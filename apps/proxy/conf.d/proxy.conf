server {
    listen 80;
    server_name proxy.sportsdey-server.adeaduratimilehin.workers.dev;

    location /health {
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    location /broadage/ {
        if ($http_x_proxy_auth != "${PROXY_SECRET}") {
            return 401;
        }

        rewrite ^/broadage/(.*)$ /$1 break;
        proxy_pass https://s0-sports-data-api.broadage.com;

        proxy_set_header Ocp-Apim-Subscription-Key "${BROADAGE_API_KEY}";
        proxy_set_header languageId "2";
        proxy_set_header Accept "application/json";

        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Authorization "";

        proxy_http_version 1.1;
        proxy_ssl_server_name on;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /paystack/ {
        if ($http_x_proxy_auth != "${PROXY_SECRET}") {
            return 401;
        }

        rewrite ^/paystack/(.*)$ /$1 break;
        proxy_pass https://api.paystack.co;

        proxy_set_header Host api.paystack.co;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Authorization $http_authorization;

        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";

        proxy_http_version 1.1;
        proxy_ssl_server_name on;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /slotegrator/ {
        access_log /var/log/nginx/slotegrator-access.log slotegrator;

        if ($http_x_proxy_auth != "${PROXY_SECRET}") {
            return 401;
        }

        rewrite ^/slotegrator/(.*)$ /$1 break;
        proxy_pass ${SLOTEGRATOR_API_URL};
        add_header X-Proxy-Upstream-URL "${SLOTEGRATOR_API_URL}$uri$is_args$args" always;

        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";

        proxy_http_version 1.1;
        proxy_ssl_server_name on;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /slotegrator-staging/ {
        access_log /var/log/nginx/slotegrator-access.log slotegrator;

        if ($http_x_proxy_auth != "${PROXY_SECRET}") {
            return 401;
        }

        rewrite ^/slotegrator-staging/(.*)$ /$1 break;
        proxy_pass ${SLOTEGRATOR_STAGING_API_URL};
        add_header X-Proxy-Upstream-URL "${SLOTEGRATOR_STAGING_API_URL}$uri$is_args$args" always;

        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";

        proxy_http_version 1.1;
        proxy_ssl_server_name on;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /sportsbook/ {
        if ($http_x_proxy_auth != "${PROXY_SECRET}") {
            return 401;
        }

        rewrite ^/sportsbook/(.*)$ /$1 break;
        proxy_pass https://betting.int.databet.cloud;

        proxy_set_header Host betting.int.databet.cloud;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $http_content_type;

        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_certificate /etc/nginx/certs/databet.crt;
        proxy_ssl_certificate_key /etc/nginx/certs/databet.key;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /sportsbook-staging/ {
        if ($http_x_proxy_auth != "${PROXY_SECRET}") {
            return 401;
        }

        rewrite ^/sportsbook-staging/(.*)$ /$1 break;
        proxy_pass https://betting.int.databet.cloud;

        proxy_set_header Host betting.int.databet.cloud;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $http_content_type;

        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_certificate /etc/nginx/certs/databet-staging.crt;
        proxy_ssl_certificate_key /etc/nginx/certs/databet-staging.key;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
